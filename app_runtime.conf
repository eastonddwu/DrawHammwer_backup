# app_server 运行期开关（所有业务进程共用，见 libsrc/common/runtime_config.h）
#
# 环境变量优先级高于本文件。业务进程由 TCM tagent 拉起并继承 tagent 的环境，
# 无法在不重启 TCM 的前提下注入环境变量，故通过本文件配置。
# 修改后需重启业务进程生效（./start.sh restart）。

# 日志级别: fatal|alert|crit|error|warn|notice|info|debug|trace
# 压测时设为 warn：tlog 是同步写盘，单线程 reactor 下每条 INFO 都是一次阻塞 write，
# 而业务层每个 RPC 出入口都有 INFO 日志，会显著污染压测数据。
APP_LOG_LEVEL=info

# 性能埋点: 1 开启，其它值或不配为关闭
# 开启后每 10 秒向日志输出一次 RPC 耗时分布(P50/P95/P99/P999)、QPS、
# 协程池水位、每帧收包数等指标。
APP_METRICS=0

# dbproxy 存储后端: tcaplus|mysql（默认 mysql）
# 当前沙箱环境无法连通 TcaplusDB dir server，故新增mysql作为并列后端，
# tcaplus相关代码完整保留未删改，可随时改回 tcaplus。
# 切换后需 ./start.sh restart 使 dbproxy 生效。
APP_DB_BACKEND=mysql

# DS 对外暴露的公网地址（ds_client_ip，见 dsagent_conf.json）。
# 沙箱机器无对外可见公网IP（hostname -I 只返回172.16.16.17内网地址），
# 无法自动探测，真实客户端连DS走这个地址，需手动配置NAT/弹性IP对应的公网IP或域名，
# 并确保UDP 20000-20099端口范围已做端口转发到本机172.16.16.17。
# 修改后需 ./start.sh restart 使 dsagent 生效（会重新生成并推送 dsagent_conf.json）。
APP_PUBLIC_IP=43.138.236.226
