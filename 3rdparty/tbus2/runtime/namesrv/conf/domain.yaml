# 该文件提供 domain.yaml 配置的示例，业务可以根据此文件生成实际的配置文件
# 示例仅展示基础用法，更加详细的路由配置说明请阅读 README.md
# 请遵循 yaml 格式的缩进规范，否则可能导致配置加载失败

---
version: 1
busid_template: "8.8.8.8"
gid_mask: "0xFFFF0000"
# 配置不同群组的路由属性
groups:
  - group_id: 9.1.1.0
    desc: 'tconnd_demo net_mode'
    route_types:
      - ROUTE_TYPE_C_HASH
    route_c_hash_replica: 100
  - group_id: 1.0.0.0
    desc: 'stateless group (echo_demo A/B 使用: busid = 0x01000000 | svr_id，即1.0.0.1/1.0.0.2；0.0.0.0是tbus2保留gid不可用，故落在此非零group下)'
    # 支持的路由策略
    route_types:
      - ROUTE_TYPE_RANDOM
  - group_id: 2.0.0.0
    desc: 'stateful group'
    route_types:
      - ROUTE_TYPE_RANDOM
      - ROUTE_TYPE_C_HASH
    # 哈希环虚拟节点个数
    route_c_hash_replica: 100
    # 子群权重规则
    shard_weights:
      - shard_id: 1
        weight: 20
      - shard_id: 2
        weight: 40
    # 灰度规则
    gray_rules:
      - src_busid_spec: 1.0.0.2
        hash_key_spec: '1000,1200-1210'
        dest_busid: 2.0.0.1
  - group_id: 3.0.0.0
    desc: 'connsvr group (connsvr busid = 0x03000000 | instance_id，即3.0.0.1/3.0.0.2/...)'
    route_types:
      - ROUTE_TYPE_RANDOM
  - group_id: 3.1.0.0
    desc: 'connsvr world=1 (TCM deploy, busid=0x03010001/3.1.0.1)'
    route_types:
      - ROUTE_TYPE_RANDOM
  - group_id: 4.0.0.0
    desc: 'rolesvr group (rolesvr busid = 0x04000000 | instance_id，即4.0.0.1/4.0.0.2/...)'
    route_types:
      - ROUTE_TYPE_RANDOM
  - group_id: 4.1.0.0
    desc: 'rolesvr world=1 (TCM deploy, busid=0x04010001/4.1.0.1)'
    route_types:
      - ROUTE_TYPE_RANDOM
  - group_id: 5.0.0.0
    desc: 'dbproxy group (dbproxy busid = 0x05000000 | instance_id，即5.0.0.1/5.0.0.2/...)'
    route_types:
      - ROUTE_TYPE_RANDOM
  - group_id: 5.1.0.0
    desc: 'dbproxy world=1 (TCM deploy, busid=0x05010001/5.1.0.1)'
    route_types:
      - ROUTE_TYPE_RANDOM
  - group_id: 6.0.0.0
    desc: 'roomsvr group (roomsvr busid = 0x06000000 | instance_id)'
    route_types:
      - ROUTE_TYPE_RANDOM
  - group_id: 6.1.0.0
    desc: 'roomsvr world=1 (TCM deploy, busid=0x06010001/6.1.0.1)'
    route_types:
      - ROUTE_TYPE_RANDOM
  - group_id: 7.0.0.0
    desc: 'dscenter group (dscenter busid = 0x07000000 | instance_id)'
    route_types:
      - ROUTE_TYPE_RANDOM
  - group_id: 7.1.0.0
    desc: 'dscenter world=1 (TCM deploy, busid=0x07010001/7.1.0.1)'
    route_types:
      - ROUTE_TYPE_RANDOM
  - group_id: 8.0.0.0
    desc: 'dsagent group (dsagent busid = 0x08000000 | instance_id)'
    route_types:
      - ROUTE_TYPE_RANDOM
  - group_id: 8.1.0.0
    desc: 'dsagent world=1 (TCM deploy, busid=0x08010001/8.1.0.1)'
    route_types:
      - ROUTE_TYPE_RANDOM
  - alias: "game100.shanghai.*.*"
    desc: 'alias demo 1'
    route_types:
      - ROUTE_TYPE_M_HASH
  - alias: "[game101, game102].[1-3]aa[100-200, tt, xx]zz.*.*"
    desc: 'alias demo 2'
    route_types:
      - ROUTE_TYPE_MASTER
# 确定每个分段下的别名分配规则
alias_rules:
  - level: 1
    desc: "game"
    # 固定分配规则
    alias:
      - "game100=100;game101=101;game102=102"
  - level: 2
    desc: "zone"
    alias:
      - "shanghai=100;taiyuan=101;beijing=102;gansu=103"
    # 自动分配规则
    min_autogen_id: 150
    max_autogen_id: 255
  - level: 3
    desc: "platform"
    alias:
      - "ios=100"
      - "android=101"
    min_autogen_id: 150
    max_autogen_id: 255
  - level: 4
    desc: "instance_id"
    min_autogen_id: 150
    max_autogen_id: 255
# 指定 domain_id 对应的别名
domain_alias_rules:
  - "domain1=1"
  - "domain2=2"
# 跨集群转发的相关配置
router:
  proxy_gid: 1.100.0.0
