# mysql connection config for dbproxy (used only when APP_DB_BACKEND=mysql)
# Format: key=value, lines starting with # are comments

# mysql host
host=127.0.0.1

# mysql port
port=3306

# mysql user
user=root

# mysql password
password=@Wudidi520520

# mysql database name
database=app_server

# mysql table names (one per line, each table_name creates a separate entry)
table_name=login
table_name=user_info

# 连接池大小 = dbproxy 对 MySQL 的最大并发请求数。
# dbproxy 是单线程协程 reactor，一条连接同时只能有一个在飞查询，
# 所以这个值直接决定并发上限；池打满时后续请求排队等空闲连接（严格FIFO，不会饿死）。
# 实测吞吐随该值近线性增长（test_mysql_async，64协程 Set+Get 混合）：
#   conn_num=2 → 1389 qps，4 → 2193，8 → 4076，16 → 6376，32 → 11678
# 端到端也印证了它是瓶颈所在（bench_client login，200并发）：
#   conn_num=16 → 1814 qps / Login p50 131ms，32 → 2617 qps / p50 66ms
# 调大时注意 MySQL 的 max_connections（本环境151）要能容纳
# 所有 dbproxy 实例数 × conn_num，并给其它接入方留余量。
conn_num=32

# 单次异步操作等待 socket 就绪的超时（毫秒）。
# 超时意味着查询还在飞、连接协议状态不明，该连接会被关掉重连，
# 故要明显小于调用方的 RPC 超时（rolesvr/dsagent 调 dbproxy 用的是 1000ms）。
op_timeout_ms=800
